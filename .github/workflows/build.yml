name: Build ArsWebUI
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install arduino-cli
      run: |
        curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
        echo "$HOME/bin" >> $GITHUB_PATH
    - name: Install ESP32 board package
      run: |
        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32@3.0.7
    - name: Install libraries
      run: |
        arduino-cli lib install "ESPAsyncWebServer-esphome"
        arduino-cli lib install "AsyncTCP"
        arduino-cli lib install "Adafruit NeoPixel"
    - name: Patch libnet80211.a
      run: |
        LIB=$(find ~/.arduino15/packages/esp32/hardware -name "libnet80211.a" -path "*/esp32s3/*" | head -1)
        OBJ=$(find ~/.arduino15/packages/esp32/tools -name "xtensa-esp32s3-elf-objcopy" | head -1)
        echo "Patching: $LIB"
        echo "With: $OBJ"
        $OBJ --weaken-symbol=ieee80211_raw_frame_sanity_check "$LIB" "$LIB"
        echo "Patch applied."
    - name: Compile
      run: |
        arduino-cli compile \
          --fqbn esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=huge_app,PSRAM=opi,CPUFreq=240,DebugLevel=none \
          --output-dir ./build \
          ./ArsWebUI
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ArsWebUI-firmware
        path: build/
