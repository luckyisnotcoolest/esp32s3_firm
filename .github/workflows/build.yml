name: Build ArsWebUI v3.0 ESP32-S3 (objcopy)

on:
  push:
  workflow_dispatch:

jobs:
  build-objcopy:
    name: Build (objcopy patch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 3.3.5
        run: |
          arduino-cli config init
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.5 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Weaken ieee80211_raw_frame_sanity_check
        run: |
          set -e
          OBJCOPY=$(find ~/.arduino15/packages/esp32 -type f -name "xtensa-esp32s3-elf-objcopy" | head -1)
          LIBNET=$(find ~/.arduino15/packages/esp32/tools/esp32-arduino-libs \
            -path "*/esp32s3/lib/libnet80211.a" | head -1)
          echo "objcopy = $OBJCOPY"
          echo "libnet  = $LIBNET"
          test -n "$OBJCOPY" && test -n "$LIBNET"
          cp "$LIBNET" "$LIBNET.bak"
          "$OBJCOPY" --weaken-symbol=ieee80211_raw_frame_sanity_check "$LIBNET" "$LIBNET"
          echo "weaken OK"
          # verify symbol is now weak
          nm "$LIBNET" 2>/dev/null | grep -i ieee80211_raw_frame_sanity || true

      - name: Install libraries
        run: |
          LIBDIR="$HOME/Arduino/libraries"
          mkdir -p "$LIBDIR"
          git clone --depth 1 https://github.com/ESP32Async/AsyncTCP.git "$LIBDIR/AsyncTCP"
          git clone --depth 1 https://github.com/ESP32Async/ESPAsyncWebServer.git "$LIBDIR/ESPAsyncWebServer"
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Prepare sketch
        run: |
          mkdir -p ArsWebUI
          cp ArsWebUI.ino web_content.h ArsWebUI/

      - name: Compile
        run: |
          arduino-cli compile -v \
            --fqbn "esp32:esp32:esp32s3:PartitionScheme=huge_app,CPUFreq=240,PSRAM=opi,FlashSize=16M,DebugLevel=none,UploadSpeed=921600,CDCOnBoot=default,USBMode=hwcdc" \
            --output-dir build \
            ArsWebUI

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-objcopy
          path: build/
          retention-days: 30
