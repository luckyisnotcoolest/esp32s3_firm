name: Build ESP32-S3 Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Arduino CLI ───────────────────────────────────────────────────────
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # ── 3. Install ESP32 Arduino core 3.3.5 ──────────────────────────────────
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.5 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      # ── 4. Patch libnet80211.a ───────────────────────────────────────────────
      # Weakens ieee80211_raw_frame_sanity_check from GLOBAL → WEAK so the
      # stub in ArsWebUI.ino wins at link time, letting raw deauth/disassoc
      # frames reach the radio.
      - name: Patch libnet80211.a
        run: |
          TOOLCHAIN=$(find ~/.arduino15/packages/esp32/tools/esp-x32 \
            -name "xtensa-esp32s3-elf-objcopy" | head -1)
          LIBNET=$(find ~/.arduino15/packages/esp32 \
            -name "libnet80211.a" -path "*/esp32s3/*" | head -1)
          echo "Toolchain : $TOOLCHAIN"
          echo "Library   : $LIBNET"
          "$TOOLCHAIN" \
            --weaken-symbol=ieee80211_raw_frame_sanity_check \
            "$LIBNET" "$LIBNET"
          echo "Patch applied."

      # ── 5. Install 3rd-party libraries ───────────────────────────────────────
      - name: Install libraries
        run: |
          LIBDIR="$HOME/Arduino/libraries"
          mkdir -p "$LIBDIR"
          git clone --depth 1 https://github.com/ESP32Async/AsyncTCP.git \
            "$LIBDIR/AsyncTCP"
          git clone --depth 1 https://github.com/ESP32Async/ESPAsyncWebServer.git \
            "$LIBDIR/ESPAsyncWebServer"
          arduino-cli lib install "Adafruit NeoPixel"

      # ── 6. Prepare sketch folder ─────────────────────────────────────────────
      - name: Prepare sketch folder
        run: |
          mkdir -p ArsWebUI
          cp ArsWebUI.ino  ArsWebUI/
          cp web_content.h ArsWebUI/

      # ── 7. Compile ───────────────────────────────────────────────────────────
      - name: Compile ESP32-S3
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:EraseFlash=none,PartitionScheme=huge_app,ZigbeeMode=default,LoopCore=1,CDCOnBoot=default,DFUOnBoot=default,JTAGAdapter=default,CPUFreq=240,PSRAM=opi,UploadMode=default,EventsCore=1,MSCOnBoot=default,USBMode=hwcdc,FlashMode=qio,FlashSize=16M,DebugLevel=none,UploadSpeed=921600" \
            --output-dir build \
            ArsWebUI

      # ── 8. Merge all three bins into one via esptool ─────────────────────────
      # merged_0x0000.bin: flash everything in one shot at address 0x0000.
      # Ideal for web flashers (ESP Web Tool) and esptool one-liners.
      # The three separate bins are preserved for ArduinoDroid / manual flash.
      - name: Create merged bin
        run: |
          pip install esptool --quiet
          python -m esptool --chip esp32s3 merge_bin \
            --output build/merged.bin \
            --flash_mode qio \
            --flash_size 16MB \
            0x0000  build/ArsWebUI.ino.bootloader.bin \
            0x8000  build/ArsWebUI.ino.partitions.bin \
            0x10000 build/ArsWebUI.ino.bin

      # ── 9. Organise artifacts ────────────────────────────────────────────────
      # Layout inside the downloaded zip:
      #
      #   OPTION A — Single file (web flasher / esptool):
      #     merged_0x0000.bin          ← flash at 0x0000, covers everything
      #
      #   OPTION B — Three files (ArduinoDroid / manual esptool):
      #     bootloader_0x0000.bin      ← flash at 0x0000
      #     partitions_0x8000.bin      ← flash at 0x8000
      #     firmware_0x10000.bin       ← flash at 0x10000
      #
      # esptool one-liner for Option B:
      #   esptool.py --chip esp32s3 --baud 921600 write_flash \
      #     0x0000 bootloader_0x0000.bin \
      #     0x8000 partitions_0x8000.bin \
      #     0x10000 firmware_0x10000.bin
      - name: Organise artifacts
        run: |
          mkdir -p artifacts

          # ── Option A: merged ─────────────────────────────────────────────────
          cp build/merged.bin  artifacts/merged_0x0000.bin

          # ── Option B: separate ───────────────────────────────────────────────
          cp build/ArsWebUI.ino.bootloader.bin  artifacts/bootloader_0x0000.bin
          cp build/ArsWebUI.ino.partitions.bin  artifacts/partitions_0x8000.bin
          cp build/ArsWebUI.ino.bin             artifacts/firmware_0x10000.bin

          echo "=== Artifact sizes ==="
          ls -lh artifacts/

      # ── 10. Upload artifacts ─────────────────────────────────────────────────
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: artifacts/
          retention-days: 30
