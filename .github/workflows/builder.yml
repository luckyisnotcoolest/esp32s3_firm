name: Build ESP32-S3 Firmware

on:
  push:
  workflow_dispatch:

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — Pre-patched libnet80211.a (from libs/esp32s3/ in this repo)
  # Binary patch modifies the function body — works on IDF 5.5+
  # Downloads as: firmware.zip
  # ════════════════════════════════════════════════════════════════════════════
  build-prepatched:
    name: Build (Pre-patched libnet)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.5 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      # Inject the binary-patched libnet80211.a committed to this repo.
      # Specifically built for Arduino 3.3.5 / IDF 5.5.2 / ESP32-S3.
      # Modifies the function body — not just symbol binding.
      - name: Inject pre-patched libnet80211.a
        run: |
          LIBNET=$(find ~/.arduino15/packages/esp32 \
            -name "libnet80211.a" -path "*/esp32s3/*" | head -1)
          echo "Target : $LIBNET"
          if [ -z "$LIBNET" ]; then
            echo "ERROR: libnet80211.a not found"; exit 1
          fi
          cp libs/esp32s3/libnet80211.a "$LIBNET"
          echo "Pre-patched libnet injected ($(du -h libs/esp32s3/libnet80211.a | cut -f1))"

      - name: Install libraries
        run: |
          LIBDIR="$HOME/Arduino/libraries"
          mkdir -p "$LIBDIR"
          git clone --depth 1 https://github.com/ESP32Async/AsyncTCP.git \
            "$LIBDIR/AsyncTCP"
          git clone --depth 1 https://github.com/ESP32Async/ESPAsyncWebServer.git \
            "$LIBDIR/ESPAsyncWebServer"
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Prepare sketch folder
        run: |
          mkdir -p ArsWebUI
          cp ArsWebUI.ino  ArsWebUI/
          cp web_content.h ArsWebUI/

      - name: Compile ESP32-S3
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:EraseFlash=none,PartitionScheme=huge_app,ZigbeeMode=default,LoopCore=1,CDCOnBoot=default,DFUOnBoot=default,JTAGAdapter=default,CPUFreq=240,PSRAM=opi,UploadMode=default,EventsCore=1,MSCOnBoot=default,USBMode=hwcdc,FlashMode=qio,FlashSize=16M,DebugLevel=none,UploadSpeed=921600" \
            --output-dir build \
            ArsWebUI

      # firmware.zip — pre-patched build (recommended)
      - name: Upload firmware.zip
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/
          retention-days: 30


  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — GitHub-side objcopy patch (weaken symbol at build time)
  # Symbol-weakening approach — may not work on IDF 5.5+ but included
  # for comparison. If pre-patched (Job 1) works, use that one.
  # Downloads as: Firmware.zip
  # ════════════════════════════════════════════════════════════════════════════
  build-objcopy:
    name: Build (objcopy patch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.5 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      # Weaken ieee80211_raw_frame_sanity_check via objcopy.
      # Note: symbol-weakening may not bypass the check on IDF 5.5+.
      # Use firmware.zip (Job 1) if deauth does not work with this build.
      - name: Patch libnet80211.a (objcopy)
        run: |
          OBJCOPY=$(find ~/.arduino15/packages/esp32/tools/esp-x32 \
            -name "xtensa-esp32s3-elf-objcopy" | head -1)
          LIBNET=$(find ~/.arduino15/packages/esp32 \
            -name "libnet80211.a" -path "*/esp32s3/*" | head -1)
          echo "objcopy : $OBJCOPY"
          echo "libnet  : $LIBNET"
          if [ -z "$OBJCOPY" ] || [ -z "$LIBNET" ]; then
            echo "ERROR: toolchain or libnet not found"; exit 1
          fi
          "$OBJCOPY" \
            --weaken-symbol=ieee80211_raw_frame_sanity_check \
            "$LIBNET" "$LIBNET"
          echo "objcopy patch applied"

      - name: Install libraries
        run: |
          LIBDIR="$HOME/Arduino/libraries"
          mkdir -p "$LIBDIR"
          git clone --depth 1 https://github.com/ESP32Async/AsyncTCP.git \
            "$LIBDIR/AsyncTCP"
          git clone --depth 1 https://github.com/ESP32Async/ESPAsyncWebServer.git \
            "$LIBDIR/ESPAsyncWebServer"
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Prepare sketch folder
        run: |
          mkdir -p ArsWebUI
          cp ArsWebUI.ino  ArsWebUI/
          cp web_content.h ArsWebUI/

      - name: Compile ESP32-S3
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:EraseFlash=none,PartitionScheme=huge_app,ZigbeeMode=default,LoopCore=1,CDCOnBoot=default,DFUOnBoot=default,JTAGAdapter=default,CPUFreq=240,PSRAM=opi,UploadMode=default,EventsCore=1,MSCOnBoot=default,USBMode=hwcdc,FlashMode=qio,FlashSize=16M,DebugLevel=none,UploadSpeed=921600" \
            --output-dir build \
            ArsWebUI

      # Firmware.zip — objcopy build (fallback / comparison)
      - name: Upload Firmware.zip
        uses: actions/upload-artifact@v4
        with:
          name: Firmware
          path: build/
          retention-days: 30
